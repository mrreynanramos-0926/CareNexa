openapi: 3.0.3
info:
  title: CareNexa API
  version: 0.1.0
  description: >
    Local REST API for the CareNexa clinic CRM. Insights are rule-based.
    Money fields are decimal strings in Philippine pesos.
servers:
  - url: http://localhost:4000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      security: []
      summary: Health check
      responses:
        '200': { description: OK }
  /api/auth/login:
    post:
      security: []
      summary: Sign in
      responses:
        '200': { description: Token and user }
        '401': { description: Invalid credentials }
  /api/auth/logout:
    post:
      summary: Sign out and write an audit record
      responses:
        '204': { description: Signed out }
  /api/auth/me:
    get:
      summary: Current user
      responses:
        '200': { description: Current user }
  /api/auth/change-password:
    post:
      summary: Change the current user's password
      responses:
        '204': { description: Password changed }
  /api/customers:
    get:
      summary: List customers
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        '200': { description: Paged customers }
    post:
      summary: Create a customer
      responses:
        '201': { description: Created }
  /api/customers/{id}:
    get:
      summary: Customer profile
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Profile }
    put:
      summary: Update a customer
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated }
  /api/orders:
    get:
      summary: List orders
      responses:
        '200': { description: Paged orders }
    post:
      summary: Complete an order
      responses:
        '201': { description: Created }
  /api/inventory:
    get:
      summary: List inventory
      responses:
        '200': { description: Paged inventory }
  /api/inventory/restock:
    post:
      summary: Restock a product
      responses:
        '200': { description: Updated stock }
  /api/campaigns:
    get:
      summary: List campaigns
      responses:
        '200': { description: Campaigns }
    post:
      summary: Create a campaign
      responses:
        '201': { description: Created }
  /api/campaigns/{id}/activate:
    post:
      summary: Simulate delivery to the target segment
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Job result }
  /api/analytics/dashboard:
    get:
      summary: Executive dashboard
      responses:
        '200': { description: Dashboard payload }
  /api/ai/recommendations:
    get:
      summary: Rule-based customer, sales, and marketing findings
      responses:
        '200': { description: Findings with producer rule-based }
  /api/ai/inventory:
    get:
      summary: Rule-based inventory findings
      responses:
        '200': { description: Findings }
  /api/ai/anomalies:
    get:
      summary: Anomaly alerts
      responses:
        '200': { description: Paged alerts and summary }
  /api/reports/sales:
    get:
      summary: Sales report
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json, csv] }
      responses:
        '200': { description: JSON page or CSV file }
  /api/audit-logs:
    get:
      summary: Audit log
      responses:
        '200': { description: Paged audit rows }
  /api/pos/sync:
    post:
      summary: Sync the mock POS provider
      responses:
        '200': { description: Sync summary }
